# =============================================================================
# Dependabot - ouvre automatiquement des Pull Requests de mise a jour des
# dependances, et surtout des correctifs de securite.
#
# Un "ecosysteme" = un couple (gestionnaire de paquets, repertoire). Ce monorepo
# en compte cinq : les actions GitHub, le backend Python (uv), les DEUX
# frontends npm et le site de documentation npm (trois projets independants,
# sans workspace) et les images Docker.
#
# Les mises a jour sont GROUPEES : sans cela, une semaine ordinaire produirait
# une dizaine de PR distinctes, chacune declenchant une CI complete. Groupees,
# elles tiennent en deux ou trois PR faciles a relire.
# =============================================================================

version: 2
updates:
  # --- 1. Actions GitHub (les "uses:" des workflows) -------------------------
  # Indispensable ici, puisque les actions sont epinglees par empreinte de
  # commit : sans Dependabot elles resteraient figees pour toujours. Dependabot
  # met a jour l'empreinte ET le commentaire de version qui la suit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # --- 2. Backend Python (uv.lock) ------------------------------------------
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      backend-dev:
        dependency-type: development
        patterns: ["*"]
      backend-mineur:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Contrainte projet (CLAUDE.md) : rester sur SQLAlchemy 2.0.x.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]

  # --- 3. Portail B2C (npm) -------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend-b2c
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      # React et Next doivent monter ensemble : les mettre a jour separement
      # produit des combinaisons de versions incompatibles.
      react-et-next:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - eslint-config-next
      frontend-dev:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # Contrainte projet (CLAUDE.md) : TypeScript 7 casse typescript-eslint.
      - dependency-name: typescript
        versions: [">=7"]
      # @types/node decrit l'API de Node : sa version MAJEURE doit suivre celle
      # du runtime, definie une seule fois dans .nvmrc (24, la LTS active) et
      # reprise par la CI et l'image Docker. Laisser passer @types/node 26
      # (Node courant, non-LTS) ferait accepter par tsc des API absentes a
      # l'execution. Les correctifs mineurs continuent d'arriver.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # --- 4. Espace clinique B2B (npm) -----------------------------------------
  # Duplique de l'entree precedente : les deux applications sont des projets npm
  # independants, avec leur propre package-lock.json.
  - package-ecosystem: npm
    directory: /frontend-b2b
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      react-et-next:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - eslint-config-next
      frontend-dev:
        dependency-type: development
        patterns: ["*"]
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      # @types/node decrit l'API de Node : sa version MAJEURE doit suivre celle
      # du runtime, definie une seule fois dans .nvmrc (24, la LTS active) et
      # reprise par la CI et l'image Docker. Laisser passer @types/node 26
      # (Node courant, non-LTS) ferait accepter par tsc des API absentes a
      # l'execution. Les correctifs mineurs continuent d'arriver.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # --- 5. Site de documentation (npm) ---------------------------------------
  # Troisieme projet npm du depot, avec son propre package-lock.json. Docusaurus
  # tire beaucoup de dependances transitives : sans groupes, une semaine
  # ordinaire produirait a elle seule une demi-douzaine de PR.
  - package-ecosystem: npm
    directory: /documentation
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 5
    groups:
      # @docusaurus/core, preset-classic, module-type-aliases, tsconfig et types
      # sont publies ENSEMBLE et doivent rester sur la meme version, sous peine
      # d'erreurs de types incomprehensibles. React suit, sa version etant
      # contrainte par le coeur ; redocusaurus et @mdx-js/react par le theme.
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - redocusaurus
          - "@mdx-js/react"
          - react
          - react-dom
          - "@types/react"
      docs-dev:
        dependency-type: development
        patterns: ["*"]
    ignore:
      # Meme contrainte que les frontends (CLAUDE.md) : TypeScript 7 casse
      # typescript-eslint. Une seule regle a retenir dans tout le depot.
      - dependency-name: typescript
        versions: [">=7"]

  # --- 6. Images de base des Dockerfiles ------------------------------------
  # Mensuel : les images de base bougent moins vite, et chaque mise a jour
  # demande une verification manuelle un peu plus attentive.
  # Les montees de version MAJEURE sont ignorees : elles sont contraintes
  # ailleurs et ne peuvent pas etre decidees par Dependabot.
  #   - Python : backend/pyproject.toml impose requires-python >=3.13,<3.14,
  #     une image 3.14 ferait echouer `uv sync` des la construction ;
  #   - Node : la version vient de .nvmrc (24), partagee avec la CI et les
  #     postes de developpement ; l'image doit rester alignee dessus.
  # Une montee majeure reste possible, mais c'est une decision humaine :
  # changer d'abord la contrainte du projet, puis l'image.
  - package-ecosystem: docker
    directory: /docker/backend
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker/frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
