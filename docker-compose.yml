# VetoLib — stack de développement.
# Variables interpolées depuis .env (cp .env.example .env). Frontends sous profile "frontend" :
#   docker compose --profile frontend up -d

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL}
  APP_DB_ROLE: ${APP_DB_ROLE:-vetolib_app}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
  JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
  COOKIE_SECURE: ${COOKIE_SECURE}
  ENV: ${ENV}
  LOG_JSON: ${LOG_JSON}
  CORS_ORIGINS: ${CORS_ORIGINS}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

x-backend-build: &backend-build
  context: ./backend
  dockerfile: ../docker/backend/Dockerfile
  target: dev

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      # PG18 : PGDATA est désormais sous /var/lib/postgresql (plus /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.0-alpine3.23
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS}
    volumes:
      - ./docker/minio/create-buckets.sh:/create-buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    image: vetolib-backend:dev
    build: *backend-build
    command: uvicorn vetolib.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *backend-env
    volumes:
      - ./backend/src:/app/src
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # Pas de curl dans python:slim — on passe par urllib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: vetolib-backend:dev
    build: *backend-build
    command: taskiq worker vetolib.worker:broker
    environment:
      <<: *backend-env
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: vetolib-backend:dev
    build: *backend-build
    command: taskiq scheduler vetolib.worker:scheduler
    environment:
      <<: *backend-env
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-portal:
    profiles: ["frontend"]
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
      args:
        APP_DIR: frontend-b2c
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend-b2c:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  frontend-clinic:
    profiles: ["frontend"]
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
      args:
        APP_DIR: frontend-b2b
    command: npm run dev # le script dev de l'app fait `next dev -p 3001`
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend-b2b:/app
      - /app/node_modules
    ports:
      - "3001:3001"

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  default:
    name: vetolib
